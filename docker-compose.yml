version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cargo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cargo_user
      POSTGRES_PASSWORD: cargo_password123
      POSTGRES_DB: cargo_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cargo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data: